<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart Remind — Academic & Personal Productivity Management System</title>
    <meta name="description" content="Intelligent academic timetable and personal productivity companion with automated class reminders, 10-second audible alarms, offline caching, and PWA mobile installation." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Smart Remind — Academic & Personal Productivity Management System" />
    <meta property="og:description" content="Intelligent academic timetable companion with automated reminders, audible alarms, session notes, personal tasks, and offline access." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Remind — Academic & Personal Productivity System" />
    <meta name="twitter:description" content="Intelligent academic schedule companion with automated reminders, audible alarms, session notes, and offline access." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartRemind" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Typography: Plus Jakarta Sans for Display/Prose & JetBrains Mono for Tabular Timetables -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
            console.log('[PWA] Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
